# Despliegue de referencia para Render (plan Free).
#
# SQLite local no sobrevive a los reinicios del plan Free porque su disco es
# efímero. Por eso la base de datos vive en Turso (libSQL), que es SQLite
# gestionado y tiene un plan gratuito sin tarjeta.
#
# Crea la base en https://turso.tech y define en Render:
#   TURSO_DATABASE_URL=libsql://<tu-base>.turso.io
#   TURSO_AUTH_TOKEN=<token>
services:
  - type: web
    name: techservice-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Evita que Render elija una versión de Node demasiado nueva.
      - key: NODE_VERSION
        value: "22"
      - key: APP_VERSION
        value: 1.0.0
      - key: LOG_REQUESTS
        value: "true"
      # Se configuran en el panel de Render, nunca en el repositorio.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # URL exacta del frontend en Vercel, sin barra final.
      - key: CORS_ORIGINS
        sync: false
